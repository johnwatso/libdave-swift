name: CI

on:
  push:
    branches: [ main ]
    tags: [ "*" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    # Dave.xcframework is built with a macOS 26 deployment target, so the
    # runner must be macOS 26+. Adjust this label if/when GitHub's runner
    # image names change.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      # v4.2.2, pinned to an immutable commit for supply-chain integrity.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify bundled framework integrity and architecture
        run: |
          set -euo pipefail
          plutil -lint Frameworks/Dave.xcframework/Info.plist
          shasum -a 256 -c Frameworks/Dave.xcframework/SHA256SUMS
          archive=Frameworks/Dave.xcframework/macos-arm64/libdave_merged.a
          test "$(lipo "$archive" -archs)" = "arm64"

      - name: Swift version
        run: swift --version

      # Build from a clean checkout (no cached .build) so the C++ stdlib
      # linkage and binary deployment target are exercised the same way a
      # fresh consumer would hit them.
      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v

      - name: Consumer package smoke test
        run: |
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          cat > Package.swift <<SWIFT
          // swift-tools-version: 5.9
          import PackageDescription

          let package = Package(
              name: "ConsumerSmoke",
              platforms: [.macOS("26.0")],
              dependencies: [
                  .package(path: "$GITHUB_WORKSPACE")
              ],
              targets: [
                  .executableTarget(
                      name: "ConsumerSmoke",
                      dependencies: [
                          .product(name: "libdave-swift", package: "libdave-swift")
                      ]
                  )
              ]
          )
          SWIFT

          mkdir -p Sources/ConsumerSmoke
          cat > Sources/ConsumerSmoke/main.swift <<'SWIFT'
          import libdave_swift

          print("libdave-swift max DAVE protocol: \(DaveSession.maxSupportedProtocolVersion)")
          SWIFT

          swift build -v
          # Running the binary (not just building it) catches runtime link
          # failures against the bundled xcframework that a build alone misses.
          swift run ConsumerSmoke

  verify-release-metadata:
    # A Swift package's release version is its Git tag. Refuse a release tag
    # that is not a plain SemVer version or has no corresponding release notes.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify SemVer tag and changelog entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use plain SemVer, e.g. 2.0.0; got: $TAG" >&2
            exit 1
          fi
          grep -Eq "^## \\[$TAG\\]( - [0-9]{4}-[0-9]{2}-[0-9]{2})?$" CHANGELOG.md
