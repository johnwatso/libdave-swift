name: CI

on:
  push:
    branches: [ main ]
    tags: [ "*" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    # Dave.xcframework is built with a macOS 26 deployment target, so the
    # runner must be macOS 26+. Adjust this label if/when GitHub's runner
    # image names change.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      # v4.2.2, pinned to an immutable commit for supply-chain integrity.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify bundled framework integrity and architecture
        run: Scripts/verify-native-provenance.sh

      - name: Swift version
        run: swift --version

      # Build from a clean checkout (no cached .build) so the C++ stdlib
      # linkage and binary deployment target are exercised the same way a
      # fresh consumer would hit them.
      #
      # Warnings are errors here: this package makes explicit Sendable and
      # isolation claims, and a concurrency warning is how the compiler reports
      # that one of them stopped holding.
      - name: Build
        run: swift build -v -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test -v

      # Release builds optimize differently and drop debug preconditions, so a
      # debug-only test run can miss both miscompiles and behavior that depends
      # on assertions being live.
      - name: Test (release configuration)
        run: swift test -c release

      # Also a regression check on the manifest's tools version: this consumer
      # declares swift-tools-version 5.9, so it fails if the package ever
      # becomes unusable from an older manifest.
      - name: Consumer package smoke test
        run: |
          tmpdir="$(mktemp -d)"
          cd "$tmpdir"
          cat > Package.swift <<SWIFT
          // swift-tools-version: 5.9
          import PackageDescription

          let package = Package(
              name: "ConsumerSmoke",
              platforms: [.macOS("26.0")],
              dependencies: [
                  .package(path: "$GITHUB_WORKSPACE")
              ],
              targets: [
                  .executableTarget(
                      name: "ConsumerSmoke",
                      dependencies: [
                          .product(name: "libdave-swift", package: "libdave-swift")
                      ]
                  )
              ]
          )
          SWIFT

          mkdir -p Sources/ConsumerSmoke
          cat > Sources/ConsumerSmoke/main.swift <<'SWIFT'
          import libdave_swift

          print("libdave-swift max DAVE protocol: \(DaveSession.maxSupportedProtocolVersion)")
          SWIFT

          swift build -v
          # Running the binary (not just building it) catches runtime link
          # failures against the bundled xcframework that a build alone misses.
          swift run ConsumerSmoke

  sanitizers:
    # The wrapper hands untrusted bytes to C++ across manually managed buffers
    # and routes native callbacks back into Swift, so memory and threading
    # errors are the failure modes that unit tests alone will not surface.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Test under AddressSanitizer
        env:
          # Leak detection is unavailable on macOS; the rest of ASan applies.
          ASAN_OPTIONS: detect_leaks=0
        run: swift test --sanitize=address

      # DAVE_DEFAULT_ACTOR_EXECUTOR swaps the coordinator's dedicated serial
      # queue for the default actor executor *for this job only*.
      #
      # ThreadSanitizer cannot see the happens-before edge that Swift's
      # custom-executor enqueue path establishes, so with the shipping executor
      # every hop between two actor-isolated methods is reported as a race even
      # though the queue provably serializes them. Building against the default
      # executor keeps race detection meaningful for the state-machine logic
      # rather than burying it in false positives. The serialization guarantee
      # itself is covered by ExecutorSerializationTests, which runs in the
      # normal (dedicated-executor) test job above.
      #
      # halt_on_error makes a detected race fail the job: TSan otherwise
      # reports and exits zero.
      - name: Test under ThreadSanitizer
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: swift test --sanitize=thread -Xswiftc -DDAVE_DEFAULT_ACTOR_EXECUTOR

  native-integration:
    # Captured Welcome bytes are bound to an ephemeral HPKE key package and
    # cannot exercise a later checkout. Rebuild the pinned native inputs and
    # use the resulting test-only external sender to generate a live,
    # internally consistent three-member MLS session for the Swift wrapper.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Rebuild pinned native framework and integration helper
        run: Scripts/build-native-framework.sh

      - name: Verify rebuilt framework provenance
        env:
          DAVE_FRAMEWORK_ROOT: ${{ github.workspace }}/.build/native-rebuild/output/Dave.xcframework
        run: Scripts/verify-native-provenance.sh

      - name: Run real MLS join, rekey, and media round trip
        env:
          DAVE_EXTERNAL_SENDER_HELPER: ${{ github.workspace }}/.build/native-rebuild/build/integration/dave_external_sender_helper
        run: swift test --filter RuntimeMLSIntegrationTests

  verify-release-metadata:
    # A Swift package's release version is its Git tag. Refuse a release tag
    # that is not a plain SemVer version or has no corresponding release notes.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-and-test, sanitizers, native-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify SemVer tag and changelog entry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use plain SemVer, e.g. 2.0.0; got: $TAG" >&2
            exit 1
          fi
          grep -Eq "^## \\[$TAG\\]( - [0-9]{4}-[0-9]{2}-[0-9]{2})?$" CHANGELOG.md
